name: Release
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

# goreleaser needs write access to publish the release and upload assets
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history + tags are required for the changelog
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # cross-repo PAT so goreleaser can push the cask to candy-tools/homebrew-tap
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # hand the .deb files goreleaser has just written into dist/ to the apt job
      # below. only the .debs: dist/ also holds the binaries and archives, and a
      # flat artifact means "every release" of the APT repo.
      - name: Upload the .debs for the APT repo
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb
          if-no-files-found: error

  # publish to the APT repo. the gh-action-debian-repo engine writes
  # packages/go-deps-view.json in candy-tools/debian-repo and pushes it, which
  # triggers that repo's publish. authenticates as the candy-tools GitHub App
  # (org variable APT_APP_ID + secret APT_APP_PRIVATE_KEY), which mints a
  # short-lived token scoped to debian-repo.
  apt:
    needs: release
    permissions:
      contents: read
    uses: andresbott/gh-action-debian-repo/.github/workflows/publish.yml@v1.0.0-rc.2
    with:
      name: go-deps-view          # must match the .deb's Package field
      artifact: debs
      collection: candy-tools/debian-repo
      app-id: ${{ vars.APT_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.APT_APP_PRIVATE_KEY }}
