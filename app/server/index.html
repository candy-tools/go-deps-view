<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>go-deps-view</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --line: #3a4657;
    --line-cross: #5b6b82;
    --line-hi: #6ea8fe;
    --line-in: #f2836b;
    --layer-band: #171c23;
    --layer-line: #56647a;
    --text: #e6e9ee;
    --muted: #8a94a3;
    --node: #1e2530;
    --node-border: #37506e;
    --node-hi: #17324f;
    --node-off: #14171c;
    --node-off-border: #2b323c;
    --accent: #6ea8fe;
    --lib: #d8a657;
    --lib-line: #7a6a44;
    --pinned: #453714;
    --impl: #c792ea;
    --impl-bg: #2a2038;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--panel);
    z-index: 5;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .mod { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  .toggle {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .toggle + .toggle { margin-left: 0; }
  .toggle[hidden] { display: none; }
  .toggle input { accent-color: var(--lib); }
  .btn {
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    background: var(--node);
    border: 1px solid var(--node-border);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .btn:hover:not(:disabled) { color: var(--text); border-color: var(--line-hi); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  header .stats { color: var(--muted); font-size: 12px; }
  .legend { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .legend i { width: 14px; height: 3px; border-radius: 2px; background: var(--line-hi); }
  .legend i.in, .legend i.impl { margin-left: 6px; background: var(--line-in); }
  .legend i.impl { background: var(--impl); }
  /* The stable gutter keeps the libraries' column, sized from this width, from being
     pushed off the edge by the scrollbar that appears once the graph is drawn. */
  #wrap { width: 100%; height: calc(100vh - 49px); overflow: auto; scrollbar-gutter: stable; }
  /* At least the window's size, so layer bands reach its edges on a small graph. */
  svg { display: block; user-select: none; min-width: 100%; min-height: 100%; }

  /* Drag handles: boxes move with their contents, nodes move on their own. */
  .box-bg { stroke-width: 1; cursor: grab; touch-action: none; }
  .node { touch-action: none; cursor: pointer; }
  body.dragging, body.dragging * { cursor: grabbing !important; }

  .box-label {
    font-family: ui-monospace, monospace;
    font-weight: 700;
    font-size: 13px;
    text-anchor: start;
    letter-spacing: .03em;
    pointer-events: none;
  }

  .edge {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.5;
    transition: stroke .12s, opacity .12s;
    pointer-events: none;
  }
  .edge.cross { stroke: var(--line-cross); stroke-width: 1.7; }
  .edge.implied { stroke-dasharray: 4 4; }
  .edge.lib { stroke: var(--lib-line); }
  .edge.hi { stroke: var(--line-hi); stroke-width: 2.4; }
  .edge.hi.in { stroke: var(--line-in); } /* points at the highlighted node: something importing it */
  .edge.dim { opacity: 0.1; }
  /* From a package implementing the target's interfaces: violet, whether lit or not. */
  .edge.impl, .edge.impl.hi, .edge.impl.hi.in { stroke: var(--impl); }

  /* Quiet by default: library arrows and imports already implied by a longer path
     only appear for the node being hovered or highlighted. */
  .edge.lib:not(.hi),
  body:not(.show-implied) .edge.implied:not(.hi):not(.symbol):not(.impl) { opacity: 0; }

  .node > rect {
    fill: var(--node);
    stroke: var(--node-border);
    stroke-width: 1.5;
    transition: fill .12s, stroke .12s, opacity .12s;
  }
  .node text {
    fill: var(--text);
    font-family: ui-monospace, monospace;
    font-size: 12px;
    dominant-baseline: middle;
    text-anchor: middle;
    pointer-events: none;
  }
  .node.entry > rect { stroke: var(--accent); stroke-width: 2; }
  .node.lib > rect { stroke: var(--lib); }
  .node:hover > rect, .node.hi > rect { fill: var(--node-hi); stroke: var(--line-hi); }
  /* Amber, not hover's blue: a clicked node sits under the pointer, so the two have
     to look different for the click to show. */
  .node.pinned > rect { fill: var(--pinned); stroke: var(--lib); stroke-width: 2.5; }
  .node.dim { opacity: 0.2; }
  .node.impl-hi > rect { fill: var(--impl-bg); stroke: var(--impl); }

  /* Toggled-off nodes: greyed in place, with every edge touching them hidden. */
  .node.off { opacity: 0.5; }
  .node.off > rect,
  .node.off:hover > rect,
  .node.off.hi > rect {
    fill: var(--node-off);
    stroke: var(--node-off-border);
    stroke-width: 1.5;
  }
  .node.off text { fill: var(--muted); }
  .edge.off { display: none; }

  /* A node button's click area, wider than its strokes. */
  .hit { fill: transparent; }

  /* The info button: a circle, so the node's rect styles don't reach it. */
  .info-btn { cursor: pointer; }
  .info-btn circle { fill: transparent; stroke: var(--muted); transition: stroke .12s; }
  .info-btn text { fill: var(--muted); font-weight: 700; font-style: italic; }
  .info-btn:hover circle, .info-btn:focus-visible circle { fill: var(--accent); stroke: var(--accent); }
  .info-btn:hover text, .info-btn:focus-visible text { fill: var(--bg); }
  .info-btn:focus { outline: none; }

  /* The loupe that expands a package into its exported symbols. */
  .loupe { cursor: pointer; }
  .loupe:focus { outline: none; }
  .loupe circle, .loupe line { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; transition: stroke .12s; }
  .loupe:hover circle, .loupe:hover line,
  .loupe:focus-visible circle, .loupe:focus-visible line { stroke: var(--text); }
  .loupe.on circle, .loupe.on line { stroke: var(--accent); stroke-width: 2; }
  .loupe.loading { animation: loupe-wait 0.8s ease-in-out infinite alternate; cursor: progress; }
  @keyframes loupe-wait { to { opacity: 0.25; } }

  .sym-rule { stroke: var(--node-border); }
  .node .sym-row text, .node .sym-empty { text-anchor: start; font-size: 11px; fill: var(--muted); }
  .node .sym-empty { font-style: italic; pointer-events: none; }
  .sym-row rect { fill: transparent; transition: fill .12s; }
  .sym-row:hover rect, .sym-row.hi rect { fill: var(--node-border); }
  .node .sym-row:hover text, .node .sym-row.hi text { fill: var(--text); }
  .node .sym-row text.impl-count { text-anchor: end; fill: var(--impl); font-size: 10px; font-family: system-ui, sans-serif; }

  /* The card beside a hovered interface row: who uses it and who implements it. */
  #symTip { position: fixed; z-index: 10; max-width: 380px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--node-border); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.45); font-size: 12px; pointer-events: none; }
  #symTip[hidden] { display: none; }
  #symTip .tip-head { font: 600 13px ui-monospace, monospace; overflow-wrap: anywhere; }
  #symTip .tip-head span { font: 400 12px system-ui, sans-serif; color: var(--muted); margin-left: 6px; }
  #symTip h3 { margin: 10px 0 3px; font-size: 12px; }
  #symTip h3.uses { color: var(--line-in); }
  #symTip h3.impl { color: var(--impl); }
  #symTip div.line { font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
  #symTip .muted { color: var(--muted); }

  /* The body scrolls, not the dialog: a click on the dialog itself closes it. */
  #info { width: min(720px, calc(100vw - 32px)); max-height: none; overflow: hidden; padding: 0; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #info::backdrop { background: rgb(0 0 0 / 0.5); }
  #info .info-body { max-height: calc(100vh - 64px); overflow: auto; padding: 16px 18px 12px; }
  #infoTitle { margin: 0 0 10px; font: 700 13px ui-monospace, monospace; overflow-wrap: anywhere; color: var(--muted); }
  #info form { position: sticky; bottom: 0; text-align: right; padding-top: 10px; background: var(--panel); }

  /* The README, rendered from markdown by the server. */
  .md { font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 1.2em 0 0.5em; line-height: 1.3; color: var(--text); font-family: inherit; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; } .md h4 { font-size: 14px; }
  .md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 12px; }
  .md ul, .md ol { padding-left: 22px; }
  .md a { color: var(--accent); }
  .md code { font: 12.5px ui-monospace, monospace; background: var(--bg); border-radius: 4px; padding: 1px 4px; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  .md img { max-width: 100%; }
  .md hr { border: 0; border-top: 1px solid var(--line); }

  /* Layers: alternating bands behind the graph with a solid line between them, labelled
     in a gutter to its left. The label's halo matches the band it sits on. */
  .layer-band { fill: var(--layer-band); pointer-events: none; }
  .layer-line { stroke: var(--layer-line); stroke-width: 1.5; pointer-events: none; }
  .layer-label {
    fill: var(--muted);
    font-size: 12px;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 4px;
    pointer-events: none;
  }
  .layer-label.alt { stroke: var(--layer-band); }
  .layer-label .layer-name { fill: var(--text); font-size: 14px; font-weight: 700; }
  .layer-toggle { cursor: pointer; }
  .layer-toggle:focus { outline: none; }
  .layer-toggle rect { fill: var(--node); stroke: var(--node-border); transition: stroke .12s; }
  .layer-toggle text { fill: var(--muted); font-size: 11px; dominant-baseline: middle; text-anchor: middle; pointer-events: none; }
  .layer-toggle:hover rect, .layer-toggle:focus-visible rect { stroke: var(--line-hi); }
  .layer-toggle:hover text, .layer-toggle:focus-visible text, .layer-toggle.off text { fill: var(--text); }
  .layer-toggle.off rect { stroke: var(--lib); }
  .lib-column { fill-opacity: 0.05; pointer-events: none; }

  #err { padding: 24px; color: #ff8f8f; font-family: ui-monospace, monospace; white-space: pre-wrap; }
  #err:empty { display: none; }
</style>
</head>
<body>
  <header>
    <h1>package dependency graph</h1>
    <span class="mod" id="module"></span>
    <label class="toggle"><input type="checkbox" id="showImplied"> transitive imports</label>
    <label class="toggle"><input type="checkbox" id="showLibs" checked> external libraries</label>
    <label class="toggle" id="supportToggle" hidden><input type="checkbox" id="showSupport" checked> support packages</label>
    <button type="button" class="btn" id="hideAll">hide all</button>
    <button type="button" class="btn" id="showAll" disabled>show all</button>
    <span class="legend" title="Arrow colours on a highlighted node"><i></i>imports<i class="in"></i>imported by<i class="impl"></i>implements</span>
    <span class="stats" id="stats"></span>
  </header>
  <div id="err"></div>
  <div id="wrap"><svg id="svg"></svg></div>
  <div id="symTip" hidden></div>
  <dialog id="info" aria-labelledby="infoTitle">
    <div class="info-body">
      <h2 id="infoTitle"></h2>
      <div id="infoText" class="md"></div>
      <form method="dialog"><button class="btn">close</button></form>
    </div>
  </dialog>

<script>
const NS = "http://www.w3.org/2000/svg";
// Layout constants.
const COL_GAP = 44, ROW_GAP = 46, NODE_H = 38, PAD_X = 14;
const BOX_PAD = 16, BOX_HEAD = 28, GAP_ROOT = 24; // left offset of the diagram
const MARGIN_TOP = 30, MARGIN = 48;
// Layers: extra space at a boundary, and the line's height above the layer's content.
const LAYER_GAP = 14, LAYER_HEAD = 30;
// The gutter left of the graph holding each layer's name, description and button.
const GUTTER_W = 188, GUTTER_PAD = 12;
const NAME_LINE_H = 18, DESC_LINE_H = 15, NAME_CW = 8.2, DESC_CW = 6.4; // approx widths at 14px bold and 12px
const LAYER_BTN_W = 40, LAYER_BTN_H = 18, LAYER_BTN_GAP = 8; // the hide/show button under the text
const CHAR_W = 7.3;            // approx monospace node-label width at 12px
const LABEL_CW = 8;             // approx box-label width at 13px bold
const PORT_INSET = 0.7;         // fraction of node width arrows spread across
// The buttons at a node's right end: each claims BTN_W of the node's width, takes
// clicks in a BTN_HIT square inside it, and the last one sits BTN_INSET from the edge.
const BTN_W = 28, BTN_HIT = 24, BTN_INSET = 6;
const INFO_W = BTN_W;           // extra node width holding the info button
const LOUPE_W = BTN_W;          // extra node width holding the loupe button
const nodeWidth = (label, buttonsW, min, pad = PAD_X) => Math.max(min, label.length * CHAR_W + pad * 2 + buttonsW);
// An expanded package: its symbol rows, and the lanes beside it where arrows to them
// run. Layout reserves the lanes' room on both sides (`_laneRoom`). LANE_NEAR leaves the
// innermost lane a stub long enough to show its arrowhead, and many importers squeeze
// into LANE_ROOM_MAX rather than pushing their neighbours ever further away.
const SYM_ROW_H = 20, SYM_PAD = 4, SYM_PAD_X = 10, SYM_INDENT = 14, SYM_MAX_W = 480;
const SYM_CW = 6.6;             // approx monospace symbol width at 11px
const NO_SYMBOLS = "no exported symbols";
const IMPL_BADGE_W = 52;        // room at an interface row's right end for its "3 impl" count
const LANE_NEAR = 22, LANE_STEP = 10, LANE_ROOM_MAX = 92, LANE_BEND = 6;
// Importers sharing a row land side by side. Arrows sharing a gap or a package's lanes
// turn at different heights: side by side at a shallow angle, they'd otherwise touch.
const ROW_FAN = 7, ROW_FAN_MAX = 16, BEND_STAGGER = 12, BEND_STAGGER_ROOM = 0.6;
// Routing: clearance around packages, spacing of arrows sharing a gap, and the
// horizontal detour (px) worth taking to stay out of an unrelated folder.
const GAP_MARGIN = 7, CHANNEL = 7, BOX_PENALTY = 220;
const CURVE_STEP = 12;          // px between the samples that check a curve is clear
// Libraries (external deps) on the right, in a box or, with layers, a column as narrow
// as they allow: LIB_COL_PAD is its padding and that of the nodes inside it.
const LIB_GAP = 90, LIB_PAD = 16, LIB_COL_PAD = 8, LIB_HEAD = 36, LIB_VGAP = 12, LIB_COLOR = "#d8a657";
const LIB_HEADING = "libraries";
// Dragging: pixels of movement before a press counts as a drag rather than a
// click, and how close to the canvas's top/left edge anything may be dropped.
const DRAG_MIN = 4, EDGE_MIN = 6;
// Box accent colours, assigned by top-level folder order (cycles for large trees).
const PALETTE = ["#6ea8fe", "#63d29a", "#b48ef2", "#e0a458", "#4fd0d6", "#e879b0", "#9db4ff"];
const groupColor = i => PALETTE[i % PALETTE.length];

function el(name, attrs) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

const topFolder = id => id === "." ? "" : id.replace(/^\.\//, "").split("/")[0];

// Breaks text into lines at spaces, cutting a word only if it can't fit on a line.
function wrapText(text, perLine) {
  const lines = [];
  let line = "";
  for (let word of (text || "").split(/\s+/).filter(Boolean)) {
    while (word.length > perLine) {
      if (line) { lines.push(line); line = ""; }
      lines.push(word.slice(0, perLine));
      word = word.slice(perLine);
    }
    if (line && line.length + 1 + word.length > perLine) { lines.push(line); line = word; }
    else line = line ? line + " " + word : word;
  }
  if (line) lines.push(line);
  return lines;
}

// A layer's text as gutter lines, and the height a band needs to hold it and the
// button. The layer is undefined for the band of packages no layer lists.
function gutterText(layer) {
  const room = GUTTER_W - GUTTER_PAD * 2;
  const name = wrapText(layer?.name, Math.floor(room / NAME_CW));
  const description = wrapText(layer?.description, Math.floor(room / DESC_CW));
  const textH = name.length * NAME_LINE_H + description.length * DESC_LINE_H;
  const btnY = GUTTER_PAD + textH + (textH ? LAYER_BTN_GAP : 0);
  return { name, description, btnY, h: btnY + LAYER_BTN_H + GUTTER_PAD };
}

// Build a folder tree from package ids. Each tree node is a directory; it may
// carry a package (pkgId) and/or child directories.
function buildTree(nodes) {
  const root = { name: "", path: ".", pkgId: null, children: new Map() };
  for (const n of nodes) {
    if (n.id === ".") { root.pkgId = "."; continue; }
    const segs = n.id.replace(/^\.\//, "").split("/");
    let cur = root;
    for (const s of segs) {
      if (!cur.children.has(s)) cur.children.set(s, { name: s, path: cur.path + "/" + s, pkgId: null, children: new Map() });
      cur = cur.children.get(s);
    }
    cur.pkgId = n.id;
  }
  return root;
}

// Strongly connected components (Tarjan) of a graph given as adjacency sets.
// Components come out dependencies-first.
function components(adj) {
  const index = new Array(adj.length).fill(-1), low = [], onStack = [], stack = [], comps = [];
  let next = 0;
  const visit = v => {
    index[v] = low[v] = next++;
    stack.push(v);
    onStack[v] = true;
    for (const w of adj[v]) {
      if (index[w] < 0) { visit(w); low[v] = Math.min(low[v], low[w]); }
      else if (onStack[w]) low[v] = Math.min(low[v], index[w]);
    }
    if (low[v] !== index[v]) return;
    const comp = [];
    let w;
    do { w = stack.pop(); onStack[w] = false; comp.push(w); } while (w !== v);
    comps.push(comp);
  };
  adj.forEach((_, v) => { if (index[v] < 0) visit(v); });
  return comps;
}

// Computes every package's home position. Rows come from the imports, so an
// importer sits above what it imports unless the configured layers say otherwise;
// columns are chosen to reduce crossings between the imports that carry structure.
// Deterministic: the same graph always lays out the same way, however often it is
// rebuilt.
function layoutPackages(g) {
  const byId = new Map(g.nodes.map(n => [n.id, n]));
  const edges = g.edges.filter(e => byId.has(e.from) && byId.has(e.to));
  const out = new Map(g.nodes.map(n => [n.id, []]));
  for (const e of edges) out.get(e.from).push(e.to);

  // An import also reachable through a longer path is real but adds no structure,
  // so it neither shapes the layout nor gets drawn until asked for.
  const reachableWithout = (from, to) => {
    const seen = new Set(), stack = out.get(from).filter(x => x !== to);
    while (stack.length) {
      const x = stack.pop();
      if (x === to) return true;
      if (seen.has(x)) continue;
      seen.add(x);
      stack.push(...out.get(x));
    }
    return false;
  };
  for (const e of edges) e.implied = reachableWithout(e.from, e.to);
  const structural = edges.filter(e => !e.implied);

  // Items: packages and folders. A folder holding a single package and nothing
  // else adds no information, so it collapses into a label like "internal/store".
  const pkgItems = [];
  const pkgItem = (id, label) => {
    const nd = byId.get(id);
    nd._label = label;
    nd._collapsedW = nodeWidth(label, BTN_INSET + LOUPE_W + (nd.readme ? INFO_W : 0), 70);
    nd._w = nd._collapsedW;
    nd._laneRoom = 0;
    nd._h = NODE_H;
    const item = { kind: "pkg", id, path: id, label, w: nd._w, ids: [id] };
    pkgItems.push(item);
    return item;
  };
  const boxes = []; // children before their parents; the last one is the root
  const toItem = (dir, prefix, depth) => {
    const name = prefix + dir.name;
    const kids = [...dir.children.values()].sort((a, b) => a.name.localeCompare(b.name));
    const isRoot = depth === 0;
    if (!isRoot && !kids.length) return pkgItem(dir.pkgId, name);
    if (!isRoot && !dir.pkgId && kids.length === 1) return toItem(kids[0], name + "/", depth);
    const box = { kind: "box", path: dir.path, label: name, depth, isRoot, items: [] };
    if (dir.pkgId) box.items.push(pkgItem(dir.pkgId, isRoot ? byId.get(".").name : dir.name));
    for (const k of kids) box.items.push(toItem(k, "", depth + 1));
    box.ids = box.items.flatMap(it => it.ids);
    boxes.push(box);
    return box;
  };
  const root = toItem(buildTree(g.nodes), "", 0);

  // Configured layers, top first. An item takes the layer of its closest listed
  // path, or the "*" layer, which defaults to below everything listed. Layers only
  // order siblings, so a folder stays in one piece wherever its packages are listed.
  const layerOfPath = new Map();
  let restLayer = g.layers.length;
  g.layers.forEach((layer, i) => layer.packages.forEach(entry => {
    if (entry === "*") restLayer = i;
    else layerOfPath.set(entry, i);
  }));
  const layerOf = path => {
    if (layerOfPath.has(path)) return layerOfPath.get(path);
    const cut = path.lastIndexOf("/");
    return cut > 1 ? layerOf(path.slice(0, cut)) : restLayer;
  };

  // Rows. Inside each folder, items are layered by the imports between them, so
  // a folder stacks as one compact block. Items that import each other both ways
  // (possible for folders, whose packages may point in both directions) can't be
  // stacked: they share a band, side by side, with their packages interleaved by
  // the package-level imports, which Go guarantees are acyclic.
  const rowOf = new Map();
  const widthCap = Math.max(1200, 272 * Math.sqrt(g.nodes.length));
  function tangledGroup(items) {
    const ids = new Set(items.flatMap(it => it.ids));
    const rows = new Map();
    const rowIn = id => {
      if (rows.has(id)) return rows.get(id);
      const r = Math.max(-1, ...out.get(id).filter(d => ids.has(d)).map(rowIn)) + 1;
      rows.set(id, r);
      return r;
    };
    ids.forEach(rowIn);
    for (const it of items) it.bandRows = rows;
    return {
      items,
      rowsH: Math.max(...rows.values()) + 1,
      estW: items.reduce((s, it) => s + it.estW + COL_GAP, -COL_GAP),
    };
  }
  function assignRows(box) {
    const itemOf = new Map();
    box.items.forEach((it, i) => {
      if (it.kind === "box") assignRows(it);
      else { it.rowsH = 1; it.estW = it.w; }
      for (const id of it.ids) itemOf.set(id, i);
    });
    // Imports only order items within a configured layer; the layers stack on top.
    const configured = box.items.map(it => layerOf(it.path));
    const adj = box.items.map(() => new Set());
    for (const e of edges) {
      const a = itemOf.get(e.from), b = itemOf.get(e.to);
      if (a !== undefined && b !== undefined && a !== b && configured[a] === configured[b]) adj[a].add(b);
    }
    const comps = components(adj);
    const compOf = [], levelOf = [];
    comps.forEach((c, ci) => c.forEach(i => { compOf[i] = ci; }));
    const byLevel = new Map();
    comps.forEach((members, ci) => {
      let level = 0;
      for (const i of members) for (const j of adj[i]) {
        if (compOf[j] !== ci) level = Math.max(level, levelOf[compOf[j]] + 1);
      }
      levelOf[ci] = level;
      const items = members.map(i => box.items[i]);
      const group = items.length > 1 ? tangledGroup(items) : { items, rowsH: items[0].rowsH, estW: items[0].estW };
      group.key = items.map(it => it.label).sort()[0];
      const stacked = (g.layers.length - configured[members[0]]) * (box.items.length + 1) + level;
      (byLevel.get(stacked) || byLevel.set(stacked, []).get(stacked)).push(group);
    });
    // A level too wide for the target wraps onto more rows, which is always safe:
    // nothing in one level imports anything else in it.
    let height = 0, maxW = 0;
    for (const level of [...byLevel.keys()].sort((a, b) => a - b)) {
      let row = [], rowW = 0;
      const flush = () => {
        for (const group of row) for (const it of group.items) it.relRow = height;
        height += Math.max(0, ...row.map(group => group.rowsH));
        maxW = Math.max(maxW, rowW);
        row = [];
        rowW = 0;
      };
      for (const group of byLevel.get(level).sort((a, b) => a.key.localeCompare(b.key))) {
        if (row.length && rowW + COL_GAP + group.estW > widthCap) flush();
        rowW += group.estW + (row.length ? COL_GAP : 0);
        row.push(group);
      }
      flush();
    }
    box.rowsH = height;
    box.estW = maxW + (box.isRoot ? 0 : BOX_PAD * 2);
  }
  function applyRows(box, base) {
    for (const it of box.items) {
      const at = base + it.relRow;
      if (it.bandRows) for (const id of it.ids) rowOf.set(id, at + it.bandRows.get(id));
      else if (it.kind === "pkg") rowOf.set(it.id, at);
      else applyRows(it, at);
    }
  }
  assignRows(root);
  applyRows(root, 0);

  // Each item's row range, and how many box borders open or close on those rows.
  (function measureRows(it) {
    if (it.kind === "pkg") { it.lo = it.hi = rowOf.get(it.id); return; }
    it.items.forEach(measureRows);
    it.lo = Math.min(...it.items.map(c => c.lo));
    it.hi = Math.max(...it.items.map(c => c.hi));
    const kids = it.items.filter(c => c.kind === "box");
    it.headCount = it.isRoot ? 0 : 1 + Math.max(0, ...kids.filter(c => c.hi === it.hi).map(c => c.headCount));
    it.footCount = it.isRoot ? 0 : 1 + Math.max(0, ...kids.filter(c => c.lo === it.lo).map(c => c.footCount));
  })(root);

  // Row heights leave just enough room for the box borders that need it.
  const maxRow = Math.max(0, ...rowOf.values());
  const head = new Array(maxRow + 1).fill(0), foot = new Array(maxRow + 1).fill(0);
  for (const b of boxes) {
    if (b.isRoot) continue;
    head[b.hi] = Math.max(head[b.hi], b.headCount);
    foot[b.lo] = Math.max(foot[b.lo], b.footCount);
  }
  // Each layer holding top-level items gets a band, topped by its highest row. Layers
  // listing only nested paths have no band of their own to mark. Boundaries get extra
  // room for the line; the top row never starts one, and the gutter only exists with
  // layers, so a graph without them lays out exactly as it would otherwise.
  const layerTop = new Map();
  for (const it of root.items) {
    const i = layerOf(it.path);
    layerTop.set(i, Math.max(layerTop.get(i) ?? -1, it.hi));
  }
  const layerStartingAt = new Map([...layerTop].map(([i, top]) => [top, i]));
  const gutter = g.layers.length ? GUTTER_W : 0;
  const rootX = gutter + GAP_ROOT;
  // Sets every package's home height and returns the layer dividers. A row is as tall
  // as its tallest package, so an expanded package pushes the rows below it down. A
  // band is at least as tall as its gutter text, so that can push them down too.
  function placeRows() {
    const rowH = new Array(maxRow + 1).fill(NODE_H);
    for (const n of g.nodes) rowH[rowOf.get(n.id)] = Math.max(rowH[rowOf.get(n.id)], n._h);
    const rowY = new Array(maxRow + 1);
    let y = MARGIN_TOP + head[maxRow] * BOX_HEAD;
    let bandEnd = gutterText(g.layers[layerStartingAt.get(maxRow)]).h;
    for (let r = maxRow; r >= 0; r--) {
      rowY[r] = y;
      if (r === 0) break;
      y += rowH[r] + foot[r] * BOX_PAD + head[r - 1] * BOX_HEAD + ROW_GAP;
      if (!layerStartingAt.has(r - 1)) continue;
      y += LAYER_GAP;
      const lineY = () => y - head[r - 1] * BOX_HEAD - LAYER_HEAD;
      y += Math.max(0, bandEnd - lineY());
      bandEnd = lineY() + gutterText(g.layers[layerStartingAt.get(r - 1)]).h;
    }
    for (const n of g.nodes) n._homeY = rowY[rowOf.get(n.id)];

    return !g.layers.length ? [] : [...layerTop]
      .sort((p, q) => q[1] - p[1])
      .map(([i, top], k) => ({
        layer: g.layers[i],
        topY: k ? rowY[top] - head[top] * BOX_HEAD - LAYER_HEAD : 0, // the first band starts at the canvas's edge
        ids: g.nodes.filter(n => layerOf(n.id) === i).map(n => n.id), // may be outside this band, if nested
      }));
  }
  placeRows();

  // Columns. Two siblings only need to avoid each other when their row ranges
  // overlap; otherwise they may share x. So a sibling order gives a set of
  // constraints: compact against them, then pull each item toward the median of
  // its neighbours within its remaining slack. Items only ever permute inside
  // their parent, so boxes can't overlap or split.
  const centerX = nd => nd._x + nd._w / 2;
  const overlaps = (a, b) => a.lo <= b.hi && b.lo <= a.hi;
  const nbrsOf = new Map(g.nodes.map(n => [n.id, []]));
  for (const e of structural) { nbrsOf.get(e.from).push(e.to); nbrsOf.get(e.to).push(e.from); }
  (function indexNeighbours(it) {
    const inside = new Set(it.ids);
    it.nbrs = it.ids.flatMap(id => nbrsOf.get(id)).filter(id => !inside.has(id));
    if (it.kind === "box") it.items.forEach(indexNeighbours);
  })(root);
  function measure(box) {
    let contentW = 0;
    box.items.forEach((it, i) => {
      if (it.kind === "box") measure(it);
      let x = 0;
      for (let j = 0; j < i; j++) {
        const o = box.items[j];
        if (overlaps(o, it)) x = Math.max(x, o.rx + o.w + COL_GAP);
      }
      it.rx = x;
      contentW = Math.max(contentW, x + it.w);
    });
    box.contentW = contentW;
    box.w = box.isRoot ? contentW : Math.max(contentW, box.label.length * LABEL_CW + 20) + BOX_PAD * 2;
  }
  function place(box, x) {
    box.x = x;
    box.ox = x + (box.w - box.contentW) / 2;
    for (const it of box.items) {
      if (it.kind === "pkg") byId.get(it.id)._x = box.ox + it.rx + byId.get(it.id)._laneRoom;
      else place(it, box.ox + it.rx);
    }
  }
  const median = values => {
    const s = [...values].sort((a, b) => a - b), m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  };
  function relax(sweeps) {
    for (let s = 0; s < sweeps; s++) {
      for (const box of boxes) {
        box.items.forEach((it, i) => {
          if (!it.nbrs.length) return;
          let lo = 0, hi = box.contentW - it.w;
          box.items.forEach((o, j) => {
            if (j === i || !overlaps(o, it)) return;
            if (j < i) lo = Math.max(lo, o.rx + o.w + COL_GAP);
            else hi = Math.min(hi, o.rx - COL_GAP - it.w);
          });
          const want = median(it.nbrs.map(id => centerX(byId.get(id)))) - box.ox - it.w / 2;
          it.rx = Math.max(lo, Math.min(hi, want));
          place(box, box.x);
        });
      }
    }
  }
  const relayout = sweeps => { measure(root); place(root, rootX); relax(sweeps); };

  // Ordering. Barycentre sweeps get stuck easily, so run them from many seeded
  // shuffles, polish with adjacent swaps, and keep the order with the fewest
  // crossings. The budget comes from the graph's size, never from a clock, so the
  // result is the same every time.
  for (const n of g.nodes) n._y = n._homeY;
  const cross = (p, q, r, s) => {
    const o = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
    return o(p, q, r) * o(p, q, s) < 0 && o(r, s, p) * o(r, s, q) < 0;
  };
  function cost() {
    const segs = structural.map(e => {
      const a = byId.get(e.from), b = byId.get(e.to);
      const [upper, lower] = a._y > b._y ? [b, a] : [a, b];
      return { p: { x: centerX(upper), y: upper._y + NODE_H }, q: { x: centerX(lower), y: lower._y }, e };
    });
    let total = 0;
    segs.forEach((s, i) => {
      total += Math.abs(s.p.x - s.q.x) * 0.002; // tie-break toward shorter arrows
      for (let j = i + 1; j < segs.length; j++) {
        const t = segs[j];
        if (s.e.from === t.e.from || s.e.to === t.e.to || s.e.from === t.e.to || s.e.to === t.e.from) continue;
        if (cross(s.p, s.q, t.p, t.q)) total++;
      }
    });
    return total;
  }
  // Packages importing libraries lean right, toward the libraries box.
  const libUses = new Map();
  for (const e of g.libEdges) libUses.set(e.from, (libUses.get(e.from) || 0) + 1);
  const barycentre = it => {
    const right = gutter + root.w + LIB_GAP;
    let sum = 0, n = 0;
    for (const id of it.nbrs) { sum += centerX(byId.get(id)); n++; }
    for (const id of it.ids) { const k = libUses.get(id) || 0; sum += k * right; n += k; }
    if (n) return sum / n;
    return it.ids.reduce((s, id) => s + centerX(byId.get(id)), 0) / it.ids.length;
  };
  const snapshot = () => new Map(boxes.map(b => [b, [...b.items]]));
  const restore = saved => { for (const [b, items] of saved) b.items = [...items]; };
  let seed = 0x9e3779b9;
  const rand = () => { // mulberry32
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const shuffle = a => {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
  };
  const budget = Math.max(120, Math.min(4000, Math.floor(3e7 / Math.max(1, structural.length ** 2))));
  let evals = 0, best = null, bestCost = Infinity;
  const score = () => { evals++; relayout(2); return cost(); };
  for (let start = 0; evals < budget; start++) {
    if (start > 0) for (const b of boxes) shuffle(b.items);
    let current = snapshot(), currentCost = score();
    for (let sweep = 0; sweep < 6; sweep++) {
      for (const b of boxes) {
        const bary = new Map(b.items.map(it => [it, barycentre(it)]));
        b.items.sort((p, q) => bary.get(p) - bary.get(q));
        relayout(1);
      }
      const c = score();
      if (c < currentCost) { currentCost = c; current = snapshot(); }
    }
    restore(current);
    let improved = true;
    while (improved && evals < budget) {
      improved = false;
      for (const b of boxes) {
        for (let i = 0; i + 1 < b.items.length; i++) {
          [b.items[i], b.items[i + 1]] = [b.items[i + 1], b.items[i]];
          const c = score();
          if (c < currentCost - 1e-9) { currentCost = c; improved = true; }
          else [b.items[i], b.items[i + 1]] = [b.items[i + 1], b.items[i]];
        }
      }
    }
    if (currentCost < bestCost) { bestCost = currentCost; best = snapshot(); }
  }
  restore(best);
  const layout = { root, layerOf, gutter };
  // Re-derives the home spots for the packages' current sizes. Rows and the chosen
  // order stay, so expanding a package moves things aside without rearranging them.
  layout.reflow = () => {
    for (const it of pkgItems) it.w = byId.get(it.id)._w + byId.get(it.id)._laneRoom * 2;
    layout.dividers = placeRows();
    relayout(8);
    for (const n of g.nodes) n._homeX = n._x;
    layout.right = rootX + root.w;
  };
  layout.reflow();
  return layout;
}

let fetchedGraph = null; // /graph.json as fetched; currentGraph is the view of it on screen
const views = new Map(); // "support packages" checked -> its view of fetchedGraph, laid out once
let currentGraph = null;
const hidden = new Set(); // package and library ids toggled off by the user; persists across re-renders
const highlighted = new Set(); // package and library ids kept highlighted by the user; persists across re-renders
const expanded = new Set(); // package ids showing their symbols; persists across re-renders
const moved = new Map();  // node id -> {dx, dy} dragged away from its computed spot; persists across re-renders
let justDragged = false;  // the press in progress became a drag, so its click must not toggle
let symbols = null;       // the indexed /symbols.json, loaded when a package is first expanded
let symbolsLoad = null;   // the load in progress or done; cleared on failure so a retry can fetch again

// The graph without its support code: the packages and libraries the config flags as
// support, the imports touching them, and the libraries only they import. It is laid
// out on its own, so the rest closes up. Nodes and edges are copies, because a layout
// stores its results on them.
function withoutSupport(g) {
  const nodes = g.nodes.filter(n => !n.support).map(n => ({ ...n }));
  const kept = new Set(nodes.map(n => n.id));
  const libEdges = g.libEdges.filter(e => kept.has(e.from)).map(e => ({ ...e }));
  const imported = new Set(libEdges.map(e => e.to));
  const libs = g.libs.filter(l => !l.support && imported.has(l.id)).map(l => ({ ...l }));
  const libIds = new Set(libs.map(l => l.id));
  return {
    module: g.module, layers: g.layers, nodes, libs,
    edges: g.edges.filter(e => kept.has(e.from) && kept.has(e.to)).map(e => ({ ...e })),
    libEdges: libEdges.filter(e => libIds.has(e.to)),
  };
}

// Shows the view the "support packages" checkbox asks for. A view laid out earlier
// keeps its layout, but packages may have been expanded or collapsed since.
function showView() {
  const withSupport = document.getElementById("showSupport").checked;
  if (!views.has(withSupport)) views.set(withSupport, withSupport ? fetchedGraph : withoutSupport(fetchedGraph));
  const view = views.get(withSupport);
  const fresh = !view._layout;
  view._layout ||= layoutPackages(view);
  currentGraph = view;
  if (!fresh || expanded.size) {
    for (const n of view.nodes) sizeNode(n);
    view._layout.reflow();
  }
  render(view);
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error((await r.text()).trim() || url + ": " + r.status);
  return r.json();
}

const symbolKey = (a, b) => a + "\n" + b;

function loadSymbols() {
  symbolsLoad ||= fetchJSON("symbols.json").then(s => {
    const rows = new Map(s.packages.map(p => [p.id, p.symbols]));
    const usedFrom = new Map(), usedBy = new Map(); // (from, to) -> symbol names; (to, symbol) -> importers
    for (const u of s.uses) {
      const pair = symbolKey(u.from, u.to), symbol = symbolKey(u.to, u.symbol);
      (usedFrom.get(pair) || usedFrom.set(pair, []).get(pair)).push(u.symbol);
      (usedBy.get(symbol) || usedBy.set(symbol, new Set()).get(symbol)).add(u.from);
    }
    // (from, to) -> interface names; (to, interface) -> implementing package -> type
    // names; to -> implementing packages; (from, type) -> the interfaces it implements.
    const implFrom = new Map(), implBy = new Map(), implementers = new Map(), implementsOf = new Map();
    for (const i of s.implements || []) {
      const pair = symbolKey(i.from, i.to), iface = symbolKey(i.to, i.interface), typ = symbolKey(i.from, i.type);
      const names = implFrom.get(pair) || implFrom.set(pair, []).get(pair);
      if (!names.includes(i.interface)) names.push(i.interface);
      const byPkg = implBy.get(iface) || implBy.set(iface, new Map()).get(iface);
      (byPkg.get(i.from) || byPkg.set(i.from, []).get(i.from)).push(i.type);
      (implementers.get(i.to) || implementers.set(i.to, new Set()).get(i.to)).add(i.from);
      (implementsOf.get(typ) || implementsOf.set(typ, []).get(typ)).push(i);
    }
    symbols = { rows, usedFrom, usedBy, implFrom, implBy, implementers, implementsOf };
  }).catch(err => { symbolsLoad = null; throw err; });
  return symbolsLoad;
}

const symbolIndent = s => s.name.includes(".") ? SYM_INDENT : 0; // a method sits under its type
// The number of types implementing the interface `name` of package `id`.
const implCount = (id, name) => [...(symbols.implBy.get(symbolKey(id, name))?.values() || [])].reduce((n, types) => n + types.length, 0);
const badgeW = (id, s) => implCount(id, s.name) ? IMPL_BADGE_W : 0;
// The packages implementing nd's interfaces that this view draws.
const implementersShown = nd => [...(symbols.implementers.get(nd.id) || [])].filter(id => currentGraph.nodes.some(n => n.id === id));

const nodeOf = id => fetchedGraph.nodes.find(n => n.id === id);
const pkgLabel = id => id === "." ? fetchedGraph.module.split("/").pop() : id.replace(/^\.\//, "");

// A type's tooltip line naming the interfaces of other packages it implements.
function implementsNote(id, name) {
  const of = symbols.implementsOf.get(symbolKey(id, name));
  return of ? "\nimplements " + of.map(i => `${nodeOf(i.to)?.name || pkgLabel(i.to)}.${i.interface}`).join(", ") : "";
}

// The card beside a hovered interface row: its signature, the packages using it, and
// the types implementing it, grouped by package. Built as text, never as markup.
function showSymTip(rowEl, id, s, laneRoom) {
  const tip = document.getElementById("symTip");
  tip.replaceChildren();
  const add = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    tip.appendChild(e);
    return e;
  };
  const head = add("div", "tip-head", s.name);
  const where = document.createElement("span");
  where.textContent = "in " + pkgLabel(id);
  head.appendChild(where);
  add("div", "line muted", s.signature);
  const users = [...(symbols.usedBy.get(symbolKey(id, s.name)) || [])].sort();
  add("h3", "uses", "Used by");
  add("div", "line" + (users.length ? "" : " muted"), users.length ? users.map(pkgLabel).join(" · ") : "no package in the module");
  add("h3", "impl", "Implemented by");
  const impls = [...(symbols.implBy.get(symbolKey(id, s.name)) || [])].sort(([p], [q]) => p.localeCompare(q));
  for (const [pkg, types] of impls) {
    const line = add("div", "line", pkgLabel(pkg) + ": " + types.join(", "));
    if (!currentGraph.nodes.some(n => n.id === pkg)) line.append(" (not drawn)");
    else if (hidden.has(pkg)) line.append(" (hidden)");
  }
  tip.hidden = false;
  // Past the lanes, so it hides none of the arrows it describes.
  const r = rowEl.getBoundingClientRect(), t = tip.getBoundingClientRect(), off = laneRoom + 12;
  const right = r.right + off + t.width <= window.innerWidth;
  tip.style.left = (right ? r.right + off : Math.max(8, r.left - off - t.width)) + "px";
  tip.style.top = Math.max(8, Math.min(r.top - 8, window.innerHeight - t.height - 8)) + "px";
}
const hideSymTip = () => { document.getElementById("symTip").hidden = true; };

// Long signatures are cut to keep the graph readable; the row's tooltip has the rest.
// Each package arriving in a lane, to use symbols or implement interfaces, needs room.
function sizeNode(nd) {
  if (!expanded.has(nd.id)) { nd._w = nd._collapsedW; nd._h = NODE_H; nd._laneRoom = 0; return; }
  const users = currentGraph.edges.filter(e => e.to === nd.id && symbols.usedFrom.has(symbolKey(e.from, e.to))).length;
  const trunks = users + implementersShown(nd).length;
  nd._laneRoom = trunks ? Math.min(LANE_ROOM_MAX, LANE_NEAR + (trunks - 1) * LANE_STEP) : 0;
  const rows = symbols.rows.get(nd.id) || [];
  nd._h = NODE_H + SYM_PAD * 2 + Math.max(1, rows.length) * SYM_ROW_H;
  const longest = Math.max(NO_SYMBOLS.length * SYM_CW, ...rows.map(s => s.signature.length * SYM_CW + symbolIndent(s) + badgeW(nd.id, s)));
  nd._w = Math.max(nd._collapsedW, Math.min(SYM_MAX_W, longest + SYM_PAD_X * 2));
}

// Expanding re-renders, so this keeps the package where it is on screen and the
// keyboard focus on its button.
async function toggleExpanded(nd, btn) {
  if (expanded.has(nd.id)) {
    expanded.delete(nd.id);
  } else {
    btn.classList.add("loading");
    try {
      await loadSymbols();
    } catch (err) {
      document.getElementById("err").textContent = String(err);
      btn.classList.remove("loading");
      return;
    }
    document.getElementById("err").textContent = "";
    expanded.add(nd.id);
  }
  const [wasX, wasY] = [nd._x, nd._y];
  sizeNode(nd);
  currentGraph._layout.reflow();
  render(currentGraph);
  const wrap = document.getElementById("wrap");
  wrap.scrollLeft += nd._x - wasX;
  wrap.scrollTop += nd._y - wasY;
  document.querySelector(`.loupe[data-pkg="${CSS.escape(nd.id)}"]`).focus({ preventScroll: true });
}

// Opens the dialog at once and fills it with the package's README when it arrives. The
// server renders the markdown and drops any raw HTML in it, so it goes in as is.
async function showReadme(nd) {
  const body = document.getElementById("infoText");
  document.getElementById("infoTitle").textContent = nd.pkg;
  body.textContent = "loading…";
  document.getElementById("info").showModal();
  try {
    const r = await fetch("readme?id=" + encodeURIComponent(nd.id));
    if (!r.ok) throw new Error((await r.text()).trim() || "readme: " + r.status);
    body.innerHTML = await r.text();
  } catch (err) {
    body.textContent = String(err);
  }
}

// A button inside a node. Its press must not reach the node: there it would capture
// the pointer, which sends the click to the node and cycles it.
function nodeButton(cls, titleText, act) {
  const btn = el("g", { class: cls, role: "button", tabindex: 0 });
  const title = el("title"); title.textContent = titleText; btn.appendChild(title);
  btn.addEventListener("pointerdown", ev => ev.stopPropagation());
  btn.addEventListener("click", ev => { ev.stopPropagation(); act(); });
  btn.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); act(); }
  });
  return btn;
}

// A transparent square under a button's strokes, so a click anywhere near it counts.
const buttonHit = (cx, cy) => el("rect", { class: "hit", x: cx - BTN_HIT / 2, y: cy - BTN_HIT / 2, width: BTN_HIT, height: BTN_HIT });

// The info button sits at a node's right end and shows the package's README.
function infoButton(nd) {
  const btn = nodeButton("info-btn", "Show the README", () => showReadme(nd));
  const cx = nd._w - BTN_INSET - INFO_W / 2, cy = NODE_H / 2;
  btn.appendChild(buttonHit(cx, cy));
  btn.appendChild(el("circle", { cx, cy, r: 9 }));
  const t = el("text", { x: cx, y: cy });
  t.textContent = "i";
  btn.appendChild(t);
  return btn;
}

// The loupe sits left of the info button, if there is one.
function loupeButton(nd) {
  const on = expanded.has(nd.id);
  const btn = nodeButton("loupe" + (on ? " on" : ""), `${on ? "Hide" : "Show"} exported symbols`, () => toggleExpanded(nd, btn));
  btn.setAttribute("data-pkg", nd.id);
  btn.setAttribute("aria-pressed", on);
  const cx = nd._w - BTN_INSET - (nd.readme ? INFO_W : 0) - LOUPE_W / 2, cy = NODE_H / 2;
  btn.appendChild(buttonHit(cx, cy));
  btn.appendChild(el("circle", { cx: cx - 1.5, cy: cy - 1.5, r: 4.5 }));
  btn.appendChild(el("line", { x1: cx + 1.8, y1: cy + 1.8, x2: cx + 5.5, y2: cy + 5.5 }));
  return btn;
}

function updateHiddenControl() {
  // "hide all" covers the packages; "show all" brings back libraries too.
  const total = document.querySelectorAll("g.node:not(.lib)").length;
  const off = document.querySelectorAll("g.node.off:not(.lib)").length;
  const showBtn = document.getElementById("showAll");
  showBtn.disabled = hidden.size === 0;
  showBtn.textContent = hidden.size ? `show all (${hidden.size})` : "show all";
  document.getElementById("hideAll").disabled = total === 0 || off >= total;
}

function render(g) {
  hideSymTip(); // its row is about to be replaced
  const showLibs = document.getElementById("showLibs").checked;
  g.nodes = g.nodes || []; g.edges = g.edges || [];
  g.libs = g.libs || []; g.libEdges = g.libEdges || [];
  g.layers = g.layers || [];
  document.getElementById("module").textContent = g.module;
  document.title = g.module + " · go-deps-view";

  const byId = new Map(g.nodes.map(n => [n.id, n]));
  // The layout is the expensive part and doesn't depend on any toggle, so it runs
  // once per graph; re-renders start again from the home spots it computed.
  const layout = g._layout || (g._layout = layoutPackages(g));
  for (const n of g.nodes) { n._x = n._homeX; n._y = n._homeY; }

  const topBoxes = layout.root.items.filter(it => it.kind === "box").map(it => it.label).sort();
  const topColor = new Map(topBoxes.map((nm, i) => [nm, groupColor(i)]));

  const boxes = []; // every drawn box, parents before their children
  // The space a node claims: an expanded package's lanes count, so boxes wrap them, the
  // canvas holds them, and arrows just passing by keep out. Libraries have no lanes.
  const nodeRect = nd => {
    const room = nd._laneRoom || 0;
    return { x: nd._x - room, y: nd._y, w: nd._w + room * 2, h: nd._h };
  };
  const centerX = nd => nd._x + nd._w / 2;

  (function addBoxes(item, color, owner) {
    for (const it of item.items) {
      if (it.kind === "pkg") {
        if (owner) owner.nodes.push(byId.get(it.id));
        continue;
      }
      const c = it.depth === 1 ? topColor.get(it.label) : color;
      const nesting = it.depth - 1;
      const box = {
        label: it.label, color: c, labelX: 12, labelY: 19,
        fillOpacity: Math.min(0.05 + 0.045 * nesting, 0.22),
        strokeOpacity: Math.min(0.3 + 0.12 * nesting, 0.7),
        pad: BOX_PAD, head: BOX_HEAD, minW: it.label.length * LABEL_CW + 20 + BOX_PAD * 2,
        nodes: [], kids: [],
        members: it.ids.map(id => byId.get(id)),
        memberIds: new Set(it.ids),
      };
      boxes.push(box);
      if (owner) owner.kids.push(box);
      addBoxes(it, c, box);
    }
  })(layout.root, null, null);
  const folderBoxes = [...boxes];

  // Libraries on the right (optional). They aren't layered, so with layers a vertical
  // line cuts them off from the bands into a column of their own, only as wide as they
  // need and at the window's right edge, so the bands get the rest. Without layers there
  // is no grid to cut and they sit in a box. Each lib sits level with the mean height
  // of the packages importing it, pushed down only as far as needed to not overlap.
  const libById = new Map(g.libs.map(l => [l.id, l]));
  const libsShown = showLibs && g.libs.length > 0;
  let libCutX = null;
  if (libsShown) {
    for (const l of g.libs) {
      l._w = layout.gutter ? nodeWidth(l.label, 0, LIB_HEADING.length * LABEL_CW, LIB_COL_PAD) : nodeWidth(l.label, 0, 90);
      l._h = NODE_H;
    }
    const libW = Math.max(...g.libs.map(l => l._w));
    if (layout.gutter) {
      const windowW = document.getElementById("wrap").clientWidth;
      libCutX = Math.max(layout.right + GAP_ROOT, windowW - libW - LIB_COL_PAD * 2);
    }
    const libX = libCutX === null ? layout.right + LIB_GAP + LIB_PAD : libCutX + LIB_COL_PAD;
    const ys = new Map(g.libs.map(l => [l.id, []]));
    for (const e of g.libEdges) {
      const a = byId.get(e.from);
      if (a && ys.has(e.to)) ys.get(e.to).push(a._y);
    }
    const meanY = id => { const a = ys.get(id); return a.length ? a.reduce((s, v) => s + v, 0) / a.length : Infinity; };
    let floor = MARGIN_TOP + LIB_HEAD;
    for (const l of [...g.libs].sort((p, q) => meanY(p.id) - meanY(q.id) || p.label.localeCompare(q.label))) {
      const want = meanY(l.id);
      l._x = libX;
      l._w = libW;
      l._y = Math.max(floor, isFinite(want) ? want : floor);
      floor = l._y + NODE_H + LIB_VGAP;
    }
    if (libCutX === null) {
      boxes.push({
        label: LIB_HEADING, color: LIB_COLOR, labelX: 14, labelY: 23,
        fillOpacity: 0.05, strokeOpacity: 0.35,
        pad: LIB_PAD, head: LIB_HEAD, minW: 0,
        nodes: g.libs, kids: [], members: g.libs,
      });
    }
  }

  // Everything above computes each node's home spot, so re-renders stay stable;
  // the user's drags are applied on top of it. The libs were ordered by the home
  // spots too, so moving a package never reshuffles them.
  const shownNodes = libsShown ? [...g.nodes, ...g.libs] : g.nodes;
  for (const nd of shownNodes) {
    const o = moved.get(nd.id);
    if (o) { nd._x += o.dx; nd._y += o.dy; }
  }

  // A box's extent is always derived from its contents, so dragging a member
  // re-wraps every box around it. Children come after parents in `boxes`, so
  // walking backwards fits inner boxes first.
  function fitBoxes() {
    for (let i = boxes.length - 1; i >= 0; i--) {
      const b = boxes[i];
      const parts = [...b.nodes.map(nodeRect), ...b.kids];
      const left = Math.min(...parts.map(p => p.x)) - b.pad;
      const right = Math.max(...parts.map(p => p.x + p.w)) + b.pad;
      const grow = Math.max(0, b.minW - (right - left)) / 2; // room for a long label
      b.x = left - grow;
      b.w = right - left + grow * 2;
      b.y = Math.min(...parts.map(p => p.y)) - b.head;
      b.h = Math.max(...parts.map(p => p.y + p.h)) + b.pad - b.y;
    }
  }
  fitBoxes();

  const allRects = () => [...shownNodes.map(nodeRect), ...boxes];
  const gutterRects = layout.dividers.map(d => ({ x: 0, y: d.topY, w: GUTTER_W, h: gutterText(d.layer).h }));

  document.getElementById("stats").textContent =
    `${g.nodes.length} packages · ${topBoxes.length} groups · ${g.libs.length} libraries`;

  const svg = document.getElementById("svg");
  // While dragging the canvas only grows: shrinking it could clamp the scroll
  // position and slide the content out from under the pointer.
  function fitCanvas(growOnly) {
    const rects = [...allRects(), ...gutterRects];
    let w = Math.max(0, ...rects.map(r => r.x + r.w)) + (libCutX === null ? MARGIN : LIB_COL_PAD);
    let h = Math.max(0, ...rects.map(r => r.y + r.h)) + MARGIN;
    if (growOnly) {
      w = Math.max(w, Number(svg.getAttribute("width")));
      h = Math.max(h, Number(svg.getAttribute("height")));
    }
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
  }
  fitCanvas(false);
  svg.innerHTML = "";

  const defs = el("defs");
  defs.innerHTML =
    `<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
       <path d="M0,0 L7,3 L0,6 Z" fill="#5b6b82"/></marker>
     <marker id="arrow-hi" markerWidth="10" markerHeight="10" refX="7.5" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
       <path d="M0,0 L7.5,3.2 L0,6.4 Z" style="fill: var(--line-hi)"/></marker>
     <marker id="arrow-in" markerWidth="10" markerHeight="10" refX="7.5" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
       <path d="M0,0 L7.5,3.2 L0,6.4 Z" style="fill: var(--line-in)"/></marker>
     <marker id="arrow-impl" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
       <path d="M1,1 L10,5 L1,9 Z" style="fill: var(--bg); stroke: var(--impl); stroke-width: 1.4"/></marker>`;
  svg.appendChild(defs);

  // Bands and lines stay at the layer's home spot: they mark the configured layout,
  // so dragging packages away doesn't move them. Every other band is tinted. The last
  // one runs off the canvas, so it still reaches the bottom when a drag grows it. They
  // stop at the libraries' column, as libraries belong to no layer.
  const bandRight = libCutX ?? "100%";
  layout.dividers.forEach((d, k) => {
    const next = layout.dividers[k + 1];
    if (k % 2) svg.appendChild(el("rect", { class: "layer-band", x: 0, y: d.topY, width: bandRight, height: next ? next.topY - d.topY : "100%" }));
    if (k) svg.appendChild(el("line", { class: "layer-line", x1: 0, x2: bandRight, y1: d.topY, y2: d.topY }));
  });
  if (layout.gutter) svg.appendChild(el("line", { class: "layer-line", x1: layout.gutter, x2: layout.gutter, y1: 0, y2: "100%" }));
  if (libCutX !== null) {
    svg.appendChild(el("rect", { class: "lib-column", x: libCutX, y: 0, width: "100%", height: "100%", fill: LIB_COLOR }));
    svg.appendChild(el("line", { class: "layer-line", x1: libCutX, x2: libCutX, y1: 0, y2: "100%" }));
    const heading = el("text", { class: "box-label", fill: LIB_COLOR, x: libCutX + LIB_COL_PAD, y: MARGIN_TOP });
    heading.textContent = LIB_HEADING;
    svg.appendChild(heading);
  }

  // Boxes (outer first so nested boxes sit on top). Deeper folder boxes are
  // slightly more opaque so the nesting reads.
  function syncBox(b) {
    b.rectEl.setAttribute("x", b.x);
    b.rectEl.setAttribute("y", b.y);
    b.rectEl.setAttribute("width", b.w);
    b.rectEl.setAttribute("height", b.h);
    b.labelEl.setAttribute("x", b.x + b.labelX);
    b.labelEl.setAttribute("y", b.y + b.labelY);
  }
  for (const b of boxes) {
    b.rectEl = el("rect", {
      class: "box-bg", rx: 10,
      fill: b.color, "fill-opacity": b.fillOpacity, stroke: b.color, "stroke-opacity": b.strokeOpacity,
    });
    b.labelEl = el("text", { class: "box-label", fill: b.color });
    b.labelEl.textContent = b.label;
    svg.appendChild(b.rectEl);
    svg.appendChild(b.labelEl);
    syncBox(b);
    makeDraggable(b.rectEl, b.members);
  }

  const edgeEls = [];
  const addEdgePath = (e, cls) => {
    const path = el("path", { class: "edge " + cls, "marker-end": "url(#arrow)" });
    path._from = e.from; path._to = e.to;
    edgeEls.push(path);
    svg.appendChild(path);
    return path;
  };

  // Library edges: package right side -> lib left side.
  const libDrawn = [];
  if (libsShown) {
    for (const e of g.libEdges) {
      const a = byId.get(e.from), l = libById.get(e.to);
      if (a && l) libDrawn.push({ a, l, path: addEdgePath(e, "lib") });
    }
  }

  // Project edges, with the ones that carry structure drawn last, on top.
  let drawn = g.edges
    .map(e => ({ e, a: byId.get(e.from), b: byId.get(e.to) }))
    .filter(x => x.a && x.b)
    .sort((p, q) => Number(q.e.implied) - Number(p.e.implied));
  // An import of an expanded package splits into a trunk with no arrowhead, routed
  // like any import, and a branch from its end to each symbol it references. They show
  // even if the import is implied, or the package's list of users would have holes. An
  // import referencing nothing, such as a blank one, stays a plain arrow.
  // A package implementing an expanded package's interfaces gets a trunk of its own
  // for them, violet with hollow heads, on the package's right, whether it imports the
  // package or not: a type needn't, to satisfy an interface. A collapsed package's
  // import arrow from an implementer turns violet instead, once the symbols are loaded.
  const branchTo = (x, names, cls) => {
    x.path.removeAttribute("marker-end");
    x.path._symbols = new Set(names);
    const rows = symbols.rows.get(x.b.id);
    x.branches = names.map(name => {
      const path = addEdgePath(x.e, `${cls} symbol`);
      path._symbols = new Set([name]);
      if (x.impl) { path._impl = true; path.setAttribute("marker-end", "url(#arrow-impl)"); }
      return { path, row: rows.findIndex(s => s.name === name) };
    });
  };
  const implTrunks = [];
  const addImplTrunk = (e, a, b, cross) => {
    const x = { e, a, b, impl: true, path: addEdgePath(e, `${cross} impl symbol`) };
    x.path._impl = true;
    branchTo(x, symbols.implFrom.get(symbolKey(a.id, b.id)), `${cross} impl`);
    implTrunks.push(x);
  };
  for (const x of drawn) {
    const cross = topFolder(x.a.id) !== topFolder(x.b.id) ? "cross" : "";
    const implied = x.e.implied ? "implied" : "";
    const open = expanded.has(x.b.id);
    const names = open ? symbols.usedFrom.get(symbolKey(x.e.from, x.e.to)) || [] : [];
    const implementing = !!symbols?.implFrom.has(symbolKey(x.e.from, x.e.to));
    if (implementing && open) addImplTrunk(x.e, x.a, x.b, cross);
    // An import that is there only for the interfaces, such as a `var _ I = T{}` check,
    // is fully told by the violet trunk.
    if (implementing && open && !names.length) { x.drop = true; continue; }
    const violet = implementing && !open;
    x.path = addEdgePath(x.e, `${cross} ${implied} ${names.length ? "symbol" : ""} ${violet ? "impl" : ""}`);
    x.branches = [];
    if (violet) { x.path._impl = true; x.path.setAttribute("marker-end", "url(#arrow-impl)"); }
    if (names.length) branchTo(x, names, `${cross} ${implied}`);
  }
  // Implementers that don't import the package they implement.
  const imports = new Set(g.edges.map(e => symbolKey(e.from, e.to)));
  for (const b of g.nodes) {
    if (!expanded.has(b.id)) continue;
    for (const from of symbols.implementers.get(b.id) || []) {
      const a = byId.get(from);
      if (!a || imports.has(symbolKey(from, b.id))) continue;
      addImplTrunk({ from, to: b.id, synthetic: true }, a, b, topFolder(from) !== topFolder(b.id) ? "cross" : "");
    }
  }
  drawn = drawn.filter(x => !x.drop).concat(implTrunks);

  // Routing works from wherever the nodes are now, so it holds up under dragging.
  // A band is a run of nodes overlapping vertically (a row, unless something was
  // dragged out of line); its gaps are where an arrow can pass through it.
  function rowBands() {
    const bands = [];
    for (const n of [...g.nodes].sort((p, q) => p._y - q._y)) {
      const last = bands[bands.length - 1];
      if (last && n._y < last.bottom) {
        last.nodes.push(n);
        last.bottom = Math.max(last.bottom, n._y + n._h);
      } else {
        bands.push({ top: n._y, bottom: n._y + n._h, nodes: [n] });
      }
    }
    for (const band of bands) {
      band.nodes.sort((p, q) => p._x - q._x);
      band.gaps = [];
      let left = -Infinity;
      for (const n of band.nodes) {
        const r = nodeRect(n);
        if (r.x - GAP_MARGIN >= left) band.gaps.push([left, r.x - GAP_MARGIN]);
        left = Math.max(left, r.x + r.w + GAP_MARGIN);
      }
      band.gaps.push([left, Infinity]);
    }
    return bands;
  }
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const inBox = (x, y, b) => x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h;
  const unrelated = (b, e) => !b.memberIds.has(e.from) && !b.memberIds.has(e.to);
  const laneX = (nd, side, offset) => side < 0 ? nd._x - offset : nd._x + nd._w + offset;

  // Picks a gap in every band an arrow must cross: a small shortest-path search
  // that prefers staying straight and staying out of folders it has no part in.
  // Distance is measured as the crow flies: counting only sideways travel would tie
  // every route that heads steadily toward the target, and the tie would go to the
  // gap's edge nearest the start, leaving the arrow a sharp late turn.
  function chooseWay(x, bands) {
    const { upper, lower, e } = x;
    const aim = nd => x.side && nd === x.b ? laneX(nd, x.side, nd._laneRoom) : centerX(nd);
    const x1 = aim(upper), y1 = upper._y + upper._h, x2 = aim(lower), y2 = lower._y;
    const step = (p, cx, cy) => p.cost + Math.hypot(cx - p.x, cy - p.y);
    let layer = [{ x: x1, y: y1, cost: 0, prev: null }];
    for (const band of bands) {
      if (band.top < y1 || band.bottom > y2) continue;
      const midY = (band.top + band.bottom) / 2;
      const line = x1 + (x2 - x1) * (midY - y1) / (y2 - y1);
      const next = [];
      band.gaps.forEach(([lo, hi], gap) => {
        const mid = isFinite(lo) && isFinite(hi) ? (lo + hi) / 2 : clamp(line, lo, hi);
        for (const cx of new Set([clamp(line, lo, hi), mid, clamp(x1, lo, hi), clamp(x2, lo, hi)])) {
          let penalty = 0;
          for (const fb of folderBoxes) if (unrelated(fb, e) && inBox(cx, midY, fb)) penalty += BOX_PENALTY;
          let prev = layer[0];
          for (const p of layer) if (step(p, cx, midY) < step(prev, cx, midY)) prev = p;
          next.push({ x: cx, y: midY, cost: step(prev, cx, midY) + penalty, prev, band, gap });
        }
      });
      layer = next;
    }
    let tail = layer[0];
    for (const p of layer) if (step(p, x2, y2) < step(tail, x2, y2)) tail = p;
    const way = [];
    for (let p = tail; p.prev; p = p.prev) way.unshift({ x: p.x, band: p.band, gap: p.gap, order: (x1 + x2) / 2 });
    return way;
  }

  // True when the S-curve between two points touches no other package and enters
  // no unrelated folder, so any waypoints between them can be dropped.
  function curveIsClear(p, q, my, x, bands) {
    const steps = Math.ceil((Math.abs(q.x - p.x) + q.y - p.y) / CURVE_STEP); // fine enough to never skip a node
    for (let k = 1; k < steps; k++) {
      const t = k / steps, s = 1 - t;
      const cx = s * s * s * p.x + 3 * s * s * t * p.x + 3 * s * t * t * q.x + t * t * t * q.x;
      const cy = s * s * s * p.y + 3 * s * s * t * my + 3 * s * t * t * my + t * t * t * q.y;
      for (const band of bands) {
        if (cy < band.top - GAP_MARGIN || cy > band.bottom + GAP_MARGIN) continue;
        for (const n of band.nodes) {
          if (n === x.a || n === x.b) continue;
          const r = nodeRect(n);
          if (cx > r.x - GAP_MARGIN && cx < r.x + r.w + GAP_MARGIN) return false;
        }
      }
      for (const fb of folderBoxes) if (unrelated(fb, x.e) && inBox(cx, cy, fb)) return false;
    }
    return true;
  }

  const sCurve = (px, py, qx, qy, my) => `C${px},${my} ${qx},${my} ${qx},${qy}`;

  // Arrows share gaps without overlapping, leave and land at distinct ports ordered
  // by direction, and keep only the waypoints they need. Hidden arrows are routed
  // too, so turning them on or hovering them moves nothing else. An import can point
  // up, through a configured layer or a drag, so routes run from the upper package
  // to the lower one and the path is reversed for those. A trunk ends beside its
  // expanded package's corner, on the importer's side, in a lane of its own.
  function routeProjectEdges(bands) {
    const channels = new Map();
    for (const x of drawn) {
      x.up = x.a._y > x.b._y + x.b._h;
      [x.upper, x.lower] = x.up ? [x.b, x.a] : [x.a, x.b];
      x.side = !x.branches.length ? 0 : x.impl ? 1 : centerX(x.a) <= centerX(x.b) ? -1 : 1;
      x.way = x.lower._y > x.upper._y + x.upper._h ? chooseWay(x, bands) : [];
      for (const w of x.way) {
        const k = bands.indexOf(w.band) + ":" + w.gap;
        (channels.get(k) || channels.set(k, []).get(k)).push(w);
      }
    }
    for (const group of channels.values()) {
      const [lo, hi] = group[0].band.gaps[group[0].gap];
      group.sort((p, q) => p.x - q.x || p.order - q.order);
      const room = isFinite(lo) && isFinite(hi) ? hi - lo : Infinity;
      const step = group.length > 1 ? Math.min(CHANNEL, room / group.length) : CHANNEL;
      // Only arrows that would overlap bunch up, each bundle centred where its arrows
      // meant to pass; an arrow crossing the gap far from the others keeps its line
      // rather than being dragged over to them and left a sharp turn to make up.
      const bundles = [];
      const startOf = b => b.sum / b.ws.length - step * (b.ws.length - 1) / 2;
      for (const w of group) {
        let b = { ws: [w], sum: w.x };
        bundles.push(b);
        for (let prev; (prev = bundles[bundles.length - 2]) && startOf(prev) + step * prev.ws.length > startOf(b); b = prev) {
          prev.ws.push(...b.ws);
          prev.sum += b.sum;
          bundles.pop();
        }
      }
      for (const b of bundles) {
        const start = startOf(b);
        b.ws.forEach((w, k) => {
          w.x = start + k * step;
          w.rank = k - (b.ws.length - 1) / 2;
        });
      }
      // Then everything is kept inside the gap, still a step apart.
      const last = group.length - 1;
      group.forEach((w, k) => { w.x = Math.max(w.x, lo + k * step); });
      group.forEach((w, k) => { w.x = Math.min(w.x, hi - (last - k) * step); });
    }
    const port = (nd, i, n) => nd._x + nd._w * (0.5 + PORT_INSET * ((i + 1) / (n + 1) - 0.5));
    const outgoing = new Map(), incoming = new Map(), beside = new Map();
    for (const x of drawn) {
      if (x.side) {
        const k = symbolKey(x.b.id, x.side);
        (beside.get(k) || beside.set(k, []).get(k)).push(x);
      }
      if (!x.side || !x.up) (outgoing.get(x.upper) || outgoing.set(x.upper, []).get(x.upper)).push(x);
      if (!x.side || x.up) (incoming.get(x.lower) || incoming.set(x.lower, []).get(x.lower)).push(x);
    }
    const aimDown = x => x.way.length ? x.way[0].x : centerX(x.lower);
    const aimUp = x => x.way.length ? x.way[x.way.length - 1].x : centerX(x.upper);
    for (const [nd, group] of outgoing) {
      group.sort((p, q) => aimDown(p) - aimDown(q) || p.lower.id.localeCompare(q.lower.id));
      group.forEach((x, i) => { x.x1 = port(nd, i, group.length); });
    }
    for (const [nd, group] of incoming) {
      group.sort((p, q) => aimUp(p) - aimUp(q) || p.upper.id.localeCompare(q.upper.id));
      group.forEach((x, i) => { x.x2 = port(nd, i, group.length); });
    }
    // Trunks reach their lanes without crossing if the one arriving furthest out takes
    // the outermost lane, and the further one has come, the later it turns. A trunk over
    // the package counts as inward, so of those the nearest takes the outermost lane.
    for (const group of beside.values()) {
      const outward = x => ((x.up ? aimDown(x) : aimUp(x)) - laneX(x.b, x.side, 0)) * x.side;
      group.sort((p, q) => outward(q) - outward(p) || p.a.id.localeCompare(q.a.id));
      const last = group.length - 1;
      [...group].sort((p, q) => Math.abs(outward(p)) - Math.abs(outward(q))).forEach((x, i) => {
        x.stagger = last ? (i - last / 2) / last : 0; // nearest -0.5, furthest +0.5
      });
      const step = last ? Math.min(LANE_STEP, (group[0].b._laneRoom - LANE_NEAR) / last) : 0;
      const byRow = new Map();
      group.forEach((x, i) => {
        x.lane = laneX(x.b, x.side, LANE_NEAR + (last - i) * step);
        if (x.up) x.x1 = x.lane; else x.x2 = x.lane;
        x.staggerSpan = last * BEND_STAGGER;
        for (const branch of x.branches) {
          (byRow.get(branch.row) || byRow.set(branch.row, []).get(branch.row)).push({ branch, order: x.up ? i : -i });
        }
      });
      // A lane that has already ended can't be crossed, so the lane ending first lands
      // first: from the top the inner ones do, and from the bottom the outer ones.
      for (const users of byRow.values()) {
        users.sort((p, q) => p.order - q.order);
        const gaps = users.length - 1;
        const fan = gaps ? Math.min(ROW_FAN, ROW_FAN_MAX / gaps) : 0;
        users.forEach(({ branch }, k) => { branch.fan = (k - gaps / 2) * fan; });
      }
    }
    for (const x of drawn) {
      const start = { x: x.x1, y: x.upper._y + x.upper._h }, end = { x: x.x2, y: x.lower._y };
      const entry = w => ({ x: w.x, y: w.band.top - 2, rank: w.rank });
      const exit = w => ({ x: w.x, y: w.band.bottom + 2, rank: w.rank });
      // A curve turns about halfway. The one reaching a lane turns at its trunk's height;
      // others leaving or reaching a shared gap turn in the order they sit in it, the one
      // in front of the direction of travel first, so the one behind passes underneath.
      const bendY = (p, q) => {
        const mid = (p.y + q.y) / 2, room = (q.y - p.y) * BEND_STAGGER_ROOM;
        if (x.side && (x.up ? p === start : q === end)) {
          return mid + (x.up ? -x.stagger : x.stagger) * Math.min(x.staggerSpan, room);
        }
        const shift = clamp((q.rank ?? p.rank ?? 0) * BEND_STAGGER, -room / 2, room / 2);
        return mid - Math.sign(q.x - p.x) * shift;
      };
      const stop = k => k === x.way.length ? end : entry(x.way[k]);
      const pieces = [];
      let from = start, i = 0;
      while (i <= x.way.length) {
        // Jump to the furthest later point reachable by one clear curve.
        let j = x.way.length;
        while (j > i && !curveIsClear(from, stop(j), bendY(from, stop(j)), x, bands)) j--;
        const to = stop(j);
        pieces.push({ from, to, curve: true, my: bendY(from, to) });
        if (j === x.way.length) break;
        const out = exit(x.way[j]);
        pieces.push({ from: to, to: out, curve: false });
        from = out;
        i = j + 1;
      }
      const ordered = x.up ? pieces.reverse().map(p => ({ ...p, from: p.to, to: p.from })) : pieces;
      let d = `M${ordered[0].from.x},${ordered[0].from.y}`;
      for (const p of ordered) {
        d += p.curve ? " " + sCurve(p.from.x, p.from.y, p.to.x, p.to.y, p.my) : ` L${p.to.x},${p.to.y}`;
      }
      x.path.setAttribute("d", d);
      for (const { path, row, fan } of x.branches) {
        const y0 = x.up ? x.b._y + x.b._h : x.b._y;
        const y = x.b._y + NODE_H + SYM_PAD + (row + 0.5) * SYM_ROW_H + fan;
        // Along the lane, round the corner, then straight into the row.
        const alongY = y + (x.up ? LANE_BEND : -LANE_BEND), inX = x.lane - x.side * LANE_BEND;
        path.setAttribute("d", `M${x.lane},${y0} L${x.lane},${alongY} Q${x.lane},${y} ${inX},${y} L${laneX(x.b, x.side, 0)},${y}`);
      }
    }
  }

  function routeEdges() {
    routeProjectEdges(rowBands());
    for (const { a, l, path } of libDrawn) {
      const x1 = a._x + a._w, y1 = a._y + NODE_H / 2, x2 = l._x, y2 = l._y + NODE_H / 2, mx = (x1 + x2) / 2;
      path.setAttribute("d", `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    }
  }
  routeEdges();

  // A band can hold no package of its own layer: its folder's packages may all be
  // listed under other layers. Then there is nothing for a button to toggle.
  const layerToggles = [];
  function addLayerToggle(d, y) {
    const btn = el("g", { class: "layer-toggle", role: "button", tabindex: 0 });
    btn.appendChild(el("rect", { x: GUTTER_PAD, y, width: LAYER_BTN_W, height: LAYER_BTN_H, rx: 5 }));
    const text = el("text", { x: GUTTER_PAD + LAYER_BTN_W / 2, y: y + LAYER_BTN_H / 2 });
    btn.appendChild(text);
    const title = el("title");
    btn.appendChild(title);
    btn.addEventListener("click", () => toggleLayer(d.ids));
    btn.addEventListener("keydown", ev => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggleLayer(d.ids); }
    });
    svg.appendChild(btn);
    layerToggles.push({ btn, text, title, ids: d.ids, name: d.layer?.name || "this layer" });
  }

  // Gutter text goes over the arrows, as one that bends far enough left can reach it.
  layout.dividers.forEach((d, k) => {
    const { name, description, btnY } = gutterText(d.layer);
    if (d.ids.length) addLayerToggle(d, d.topY + btnY);
    if (!name.length && !description.length) return;
    const label = el("text", { class: "layer-label" + (k % 2 ? " alt" : "") });
    let bottom = d.topY + GUTTER_PAD;
    const addLines = (lines, lineH, cls) => {
      for (const line of lines) {
        bottom += lineH;
        const span = el("tspan", { class: cls, x: GUTTER_PAD, y: bottom - 4 });
        span.textContent = line;
        label.appendChild(span);
      }
    };
    addLines(name, NAME_LINE_H, "layer-name");
    addLines(description, DESC_LINE_H, "");
    svg.appendChild(label);
  });

  const nodeEls = new Map();
  const symbolRowEls = [];
  const syncNode = nd => nodeEls.get(nd.id).setAttribute("transform", `translate(${nd._x},${nd._y})`);
  // An expanded package's rows, under a rule below its usual label. A row's press and
  // click reach the node, so it drags and cycles the package like the rest of it.
  function addSymbolRows(gEl, nd) {
    gEl.appendChild(el("line", { class: "sym-rule", x1: 0, x2: nd._w, y1: NODE_H, y2: NODE_H }));
    const rows = symbols.rows.get(nd.id) || [];
    if (!rows.length) {
      const empty = el("text", { class: "sym-empty", x: SYM_PAD_X, y: NODE_H + SYM_PAD + SYM_ROW_H / 2 });
      empty.textContent = NO_SYMBOLS;
      gEl.appendChild(empty);
    }
    rows.forEach((s, i) => {
      const rowEl = el("g", { class: "sym-row" });
      const y = NODE_H + SYM_PAD + i * SYM_ROW_H, indent = symbolIndent(s), badge = badgeW(nd.id, s);
      rowEl.appendChild(el("rect", { x: 1, y, width: nd._w - 2, height: SYM_ROW_H }));
      const text = el("text", { x: SYM_PAD_X + indent, y: y + SYM_ROW_H / 2 });
      const room = Math.floor((nd._w - SYM_PAD_X * 2 - indent - badge) / SYM_CW);
      text.textContent = s.signature.length > room ? s.signature.slice(0, room - 1) + "…" : s.signature;
      rowEl.appendChild(text);
      if (badge) {
        const count = el("text", { class: "impl-count", x: nd._w - SYM_PAD_X, y: y + SYM_ROW_H / 2 });
        count.textContent = implCount(nd.id, s.name) + " impl";
        rowEl.appendChild(count);
      } else {
        // An interface row with implementers has the card instead of a tooltip.
        const title = el("title"); title.textContent = s.signature + implementsNote(nd.id, s.name); rowEl.appendChild(title);
      }
      rowEl.addEventListener("mouseenter", () => { highlightSymbol(nd.id, s.name); if (badge) showSymTip(rowEl, nd.id, s, nd._laneRoom); });
      rowEl.addEventListener("mouseleave", () => { hideSymTip(); highlight(nd.id); });
      gEl.appendChild(rowEl);
      // A row lights up for a lit package using it or, for an interface, implementing it.
      const users = new Set([...(symbols.usedBy.get(symbolKey(nd.id, s.name)) || []), ...(symbols.implBy.get(symbolKey(nd.id, s.name))?.keys() || [])]);
      symbolRowEls.push({ rowEl, users });
    });
  }
  const addNode = (id, label, cls, titleText) => {
    const isPkg = byId.has(id);
    const nd = isPkg ? byId.get(id) : libById.get(id);
    const gEl = el("g", { class: cls });
    gEl.appendChild(el("rect", { width: nd._w, height: nd._h, rx: 7 }));
    const hasReadme = isPkg && nd.readme;
    const buttonsW = isPkg ? BTN_INSET + LOUPE_W + (hasReadme ? INFO_W : 0) : 0;
    const t = el("text", { x: (nd._w - buttonsW) / 2, y: NODE_H / 2 });
    t.textContent = label;
    gEl.appendChild(t);
    const title = el("title"); title.textContent = titleText; gEl.appendChild(title);
    if (hasReadme) gEl.appendChild(infoButton(nd));
    if (isPkg) gEl.appendChild(loupeButton(nd));
    if (expanded.has(id)) addSymbolRows(gEl, nd);
    gEl.addEventListener("mouseenter", () => highlight(id));
    gEl.addEventListener("mouseleave", clear);
    gEl.addEventListener("click", () => { if (!justDragged) cycleNode(id); });
    svg.appendChild(gEl);
    nodeEls.set(id, gEl);
    syncNode(nd);
    makeDraggable(gEl, [nd]);
  };
  for (const n of g.nodes) {
    const entry = n.name === "main" || g.layers[layout.layerOf(n.id)]?.entrypoint;
    addNode(n.id, n._label, "node" + (entry ? " entry" : ""), n.pkg);
  }
  if (libsShown) for (const l of g.libs) addNode(l.id, l.label, "node lib", l.id);

  // Shift nodes by the given amount, recording it so it survives re-renders.
  function shiftNodes(nodes, dx, dy) {
    for (const nd of nodes) {
      nd._x += dx; nd._y += dy;
      const o = moved.get(nd.id) || { dx: 0, dy: 0 };
      o.dx += dx; o.dy += dy;
      moved.set(nd.id, o);
    }
    fitBoxes();
  }

  // Move nodes, stopping short of the top edge and of the left edge or gutter (the
  // canvas only extends right and down). Returns how far they actually went.
  function moveNodes(nodes, dx, dy) {
    shiftNodes(nodes, dx, dy);
    const rects = allRects();
    const backX = Math.max(0, layout.gutter + EDGE_MIN - Math.min(...rects.map(r => r.x)));
    const backY = Math.max(0, EDGE_MIN - Math.min(...rects.map(r => r.y)));
    if (backX || backY) shiftNodes(nodes, backX, backY);
    return [dx + backX, dy + backY];
  }

  // Dragging `target` moves all of `nodes` by the same amount: one node for a
  // node, every descendant for a box. Boxes have no position of their own, so
  // nested boxes follow by being re-fitted. The pointer is captured, so hover
  // highlighting on other nodes stays quiet until the drop.
  function makeDraggable(target, nodes) {
    target.addEventListener("pointerdown", down => {
      if (down.button !== 0) return;
      justDragged = false;
      target.setPointerCapture(down.pointerId);
      const wrap = document.getElementById("wrap");
      const canvasPos = ev => [ev.clientX + wrap.scrollLeft, ev.clientY + wrap.scrollTop];
      const [startX, startY] = canvasPos(down);
      let doneX = 0, doneY = 0;
      const onMove = ev => {
        const [x, y] = canvasPos(ev);
        const wantX = x - startX, wantY = y - startY;
        if (!justDragged) {
          if (Math.hypot(wantX, wantY) < DRAG_MIN) return;
          justDragged = true;
          document.body.classList.add("dragging");
